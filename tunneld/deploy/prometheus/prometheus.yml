global:
  scrape_interval: 15s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: tunneld
    dns_sd_configs:
      - names: [tunneld-1, tunneld-2]
        type: A
        port: 9090
