version: 2

# tunneld is a Go module in a subdir of a repo whose APP releases use `v*` tags. OSS goreleaser has
# no monorepo mode, so this config is run FROM the tunneld/ dir on `tunneld-v<semver>` tags; the
# release-tunneld workflow strips the prefix into GORELEASER_CURRENT_TAG (a clean semver) and creates
# the GitHub release itself (goreleaser's own release is disabled below to avoid touching the app's
# `v*` tag namespace).
project_name: tunneld

before:
  hooks:
    - go mod download

builds:
  - id: tunneld
    main: ./cmd/tunneld
    binary: tunneld
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: tunneld
    ids:
      - tunneld
    formats:
      - tar.gz
    name_template: "tunneld_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

dockers:
  - id: amd64
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile.goreleaser
    use: buildx
    image_templates:
      - "ghcr.io/danielealbano/tunneld:{{ .Version }}-amd64"
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.source=https://github.com/danielealbano/android-remote-control-mcp"
      - "--label=org.opencontainers.image.description=Self-hosted HTTP tunnel server (tunneld)"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"
  - id: arm64
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile.goreleaser
    use: buildx
    image_templates:
      - "ghcr.io/danielealbano/tunneld:{{ .Version }}-arm64"
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.source=https://github.com/danielealbano/android-remote-control-mcp"
      - "--label=org.opencontainers.image.description=Self-hosted HTTP tunnel server (tunneld)"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
      - "--label=org.opencontainers.image.licenses=MIT"

docker_manifests:
  - name_template: "ghcr.io/danielealbano/tunneld:{{ .Version }}"
    image_templates:
      - "ghcr.io/danielealbano/tunneld:{{ .Version }}-amd64"
      - "ghcr.io/danielealbano/tunneld:{{ .Version }}-arm64"
  - name_template: "ghcr.io/danielealbano/tunneld:latest"
    image_templates:
      - "ghcr.io/danielealbano/tunneld:{{ .Version }}-amd64"
      - "ghcr.io/danielealbano/tunneld:{{ .Version }}-arm64"

# goreleaser does NOT create the GitHub release (that would target a `v*` tag and collide with the
# app's release scheme). The workflow creates the release on the `tunneld-v*` tag and uploads the
# dist/ archives + checksums goreleaser produced.
release:
  disable: true
