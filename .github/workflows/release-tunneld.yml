name: tunneld release

# tunneld releases are cut from `tunneld-v<semver>` tags (independent of the app's `v*` tags).
on:
  push:
    tags:
      - 'tunneld-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'tunneld tag to release (e.g. tunneld-v1.0.0)'
        required: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release + upload archives/checksums
      packages: write # push multi-arch images to ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive version
        id: ver
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # tunneld-v1.2.3 -> v1.2.3 (goreleaser strips the leading v into the image/version)
          echo "GORELEASER_CURRENT_TAG=${tag#tunneld-}" >> "$GITHUB_ENV"
      - name: GoReleaser (multi-arch build + push to ghcr.io)
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          workdir: tunneld
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create GitHub release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.ver.outputs.tag }}" \
            --title "tunneld ${GORELEASER_CURRENT_TAG}" \
            --generate-notes \
            tunneld/dist/*.tar.gz tunneld/dist/checksums.txt
